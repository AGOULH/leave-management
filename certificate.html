<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Certificate of attendance — SIG">شهادة حضور — SIG</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .cert{background:#fff;border:1px solid var(--rose200);border-radius:20px;padding:clamp(24px,5vw,56px);margin:24px auto;max-width:1000px;aspect-ratio:1.414/1;display:flex;flex-direction:column;justify-content:space-between;gap:18px;position:relative;overflow:hidden;text-align:center}
  .cert::before{content:"";position:absolute;inset:14px;border:2px solid var(--rose200);border-radius:12px;pointer-events:none}
  .cert h1{font-size:clamp(26px,4vw,44px);color:var(--red-d)}
  .cert .name{font-size:clamp(24px,3.4vw,38px);font-weight:700;border-bottom:2px solid var(--rose200);display:inline-block;padding:0 24px 6px}
  .sig-row{display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap}
  .sig-row div{min-width:180px;border-top:1px solid #CFC3C6;padding-top:8px;font-size:14px;color:var(--muted)}
  @media print{@page{size:A4 landscape;margin:0}body{background:#fff}.cert{margin:0;border:0;border-radius:0;width:297mm;height:210mm;max-width:none;aspect-ratio:auto}}
</style>
</head>
<body class="soft">
<main class="container">
  <div class="row between no-print" style="padding-top:24px">
    <a href="portal.html#certs" data-en="Back to portal">العودة للبوابة</a>
    <button type="button" class="btn btn-primary" onclick="window.print()" data-en="Print / save PDF">طباعة / حفظ PDF</button>
  </div>
  <p id="msg" class="muted no-print" style="padding-top:16px" data-en="Loading…">جارٍ التحميل…</p>
  <div id="cert"></div>
</main>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/store.js"></script>
<script>
(function () {
  const SIG = window.SIG, $ = SIG.$, t = SIG.t; let r = null;
  function paint() {
    if (!r) return;
    $('#cert').innerHTML = '<section class="cert"><div class="stack" style="--gap:10px;align-items:center">' + SIG.logo(72) +
      '<strong style="font-size:16px">' + t('المجموعة السعودية لعلم الدم المناعي', 'Saudi Immunohaematology Group') + '</strong><span class="muted" style="font-size:13px">' + t('الجمعية السعودية لطب نقل الدم', 'Saudi Society of Transfusion Medicine') + '</span></div>' +
      '<div class="stack" style="--gap:14px;align-items:center"><h1>' + t('شهادة حضور', 'Certificate of Attendance') + '</h1><p class="muted">' + t('تشهد المجموعة بأن', 'This is to certify that') + '</p>' +
      '<span class="name">' + SIG.esc(r.name) + '</span><p style="font-size:17px;line-height:1.9;max-width:680px">' + t('قد حضر/ت', 'attended') + ' <strong>' + SIG.esc(t(r.eventTitle, r.eventTitleEn || r.eventTitle)) + '</strong>' +
      (r.eventDate ? ' ' + t('بتاريخ', 'on') + ' ' + SIG.esc(SIG.fmtDate(r.eventDate)) : '') + (r.cmeHours ? ' — ' + SIG.esc(r.cmeHours) + ' ' + t('ساعة تعليم طبي مستمر', 'CME hours') : '') + '</p></div>' +
      '<div class="sig-row"><div>' + t('[رئيس اللجنة العلمية]', '[Scientific committee chair]') + '</div><div class="stack" style="--gap:6px;align-items:center;border:0"><span class="qr">' + SIG.qrSvg(r.ticket, 70) + '</span><span class="latin" style="font-size:12px">' + t('رمز التحقق: ', 'Verification: ') + SIG.esc(r.ticket) + '</span></div><div>' + t('[مدير المجموعة]', '[SIG Director]') + '</div></div></section>';
  }
  document.addEventListener('sig:ready', async () => {
    try {
      r = await SIG.store.get('registrations', SIG.param('id') || '');
      if (!r || !r.certIssued) { $('#msg').textContent = t('الشهادة غير متاحة — تأكد من تسجيل الدخول ومن إصدار الشهادة.', 'Certificate not available — make sure you are signed in and it has been issued.'); r = null; return; }
      $('#msg').textContent = ''; paint();
    } catch (e) { $('#msg').textContent = SIG.store.authError(e); }
  });
  document.addEventListener('sig:lang', paint);
})();
</script>
</body>
</html>
