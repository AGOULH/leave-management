<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Library &amp; gallery — SIG">المكتبة العلمية والصور — SIG</title>
<meta name="description" content="المواد العلمية لفعاليات المجموعة السعودية لعلم الدم المناعي ومنشورات الأعضاء ومعرض الصور.">
<meta name="theme-color" content="#C8102E">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="library">
<div id="site-header"></div>
<main>
  <section class="page-hero"><div class="container">
    <span class="crumb" data-en="Home / Library">الرئيسية / المكتبة العلمية</span>
    <h1 data-en="Scientific library &amp; gallery">المكتبة العلمية ومعرض الصور</h1>
    <p data-en="Past event materials and member publications in one place, searchable and filterable. Full materials are for members — and membership is free.">مواد الفعاليات السابقة ومنشورات الأعضاء في مكان واحد، مع بحث وتصفية. المواد الكاملة متاحة للأعضاء — والعضوية مجانية.</p>
    <div class="seg" role="tablist" aria-label="أقسام المكتبة" data-en-aria="Library sections" style="margin-top:8px">
      <button type="button" role="tab" data-tab="materials" aria-selected="true" data-en="Scientific materials">المواد العلمية</button>
      <button type="button" role="tab" data-tab="gallery" aria-selected="false" data-en="Photo gallery">معرض الصور</button>
    </div>
  </div></section>

  <div id="tab-materials" class="container stack" style="--gap:22px;padding-top:40px">
    <label class="search"><span style="color:#8A7E81" id="i-search"></span><span class="sr-only" data-en="Search materials">بحث في المواد</span>
      <input type="search" id="q" placeholder="ابحث باسم الفعالية أو السنة…" data-en-ph="Search by event or year…"></label>
    <div class="chips" role="group" id="cats" aria-label="تصفية حسب النوع" data-en-aria="Filter by type"></div>
    <span class="muted" style="font-size:14px" id="result-line" aria-live="polite"></span>
    <div class="grid" style="--min:340px;--gap:16px" id="items"></div>
  </div>

  <div id="tab-gallery" class="container stack hidden" style="--gap:22px;padding-top:40px">
    <div class="grid" style="--min:280px;--gap:16px" id="albums"></div>
    <div id="album-view" class="stack hidden" style="--gap:20px"></div>
  </div>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/library.js"></script>
</body>
</html>
